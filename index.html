<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Replinity – Never Miss A Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#1f2a1f;--g:#1fff1f;--gd:#14b814;--tx:#f2f2f2;--mu:#8a8f8a;--err:#ff5d5d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:Orbitron,"DM Sans",sans-serif;margin:0;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.brand{font-weight:800;font-size:20px}.brand b{color:var(--g)}
.btn{background:var(--g);color:#000;border:0;border-radius:12px;padding:11px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);max-width:1040px;margin:0 auto}
header.top nav{display:flex;gap:8px;align-items:center}
header.top a{color:var(--mu);text-decoration:none;margin-right:10px;font-size:15px}
.hero{display:grid;gap:28px;padding:44px 0 32px}
@media(min-width:820px){.hero{grid-template-columns:1.1fr 1fr;align-items:center}}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.08}
.hero h1 span{color:var(--g)}
.hero p{color:var(--mu);max-width:48ch;margin:16px 0 22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chat{border:1px solid var(--g);border-radius:18px;background:var(--panel);box-shadow:0 0 40px #1fff1f22;display:flex;flex-direction:column;height:420px;overflow:hidden}
.chat .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:9px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--g);color:#000;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:#171717;border-bottom-left-radius:4px}
.m.o{align-self:flex-start;background:#0f2a0f;border:1px solid var(--gd);border-bottom-left-radius:4px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat input{flex:1;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.sec{padding:36px 0;border-top:1px solid var(--line)}
.sec h2{font-size:24px;margin-bottom:18px}
.feat{display:grid;gap:0}
.feat div{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.feat b{color:var(--g)}.feat span{color:var(--mu)}
@media(min-width:820px){.feat div{grid-template-columns:240px 1fr}}
.plans{display:grid;gap:14px}
@media(min-width:820px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--panel)}
.plan.hot{border-color:var(--g);box-shadow:0 0 28px #1fff1f1c}
.plan .pr{font:800 28px Orbitron,sans-serif;margin:8px 0}
.plan ul{padding-left:18px;color:var(--mu);margin:10px 0 16px}
footer{padding:28px 18px;color:var(--mu);text-align:center;border-top:1px solid var(--line);font-size:14px}
/* auth */
.auth{max-width:400px;margin:40px auto;padding:24px;border:1px solid var(--g);border-radius:18px;background:var(--panel);box-shadow:0 0 40px #1fff1f22}
.auth h2{margin-bottom:6px}.auth p{color:var(--mu);margin:0 0 16px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
.fld{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:10px}
.lnk{background:none;border:0;color:var(--g);padding:0;text-decoration:underline}
/* app */
.app{display:grid;min-height:calc(100vh - 60px)}
@media(min-width:820px){.app{grid-template-columns:230px 1fr}}
.side{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
@media(max-width:819px){.side{display:none;position:fixed;inset:0 25% 0 0;z-index:20;background:#000;padding-top:calc(14px + env(safe-area-inset-top,0px))}.side.open{display:flex}}
.side button{text-align:left;background:none;border:0;padding:11px 12px;border-radius:10px;color:var(--tx)}
.side button.on{background:var(--g);color:#000;font-weight:700;box-shadow:0 0 18px #1fff1f55}
.side .adm{margin-top:auto;border:1px solid var(--gd);border-radius:12px;padding:12px;color:var(--mu);font-size:13px}
.main{padding:18px;min-width:0}
.main h2{font-size:24px;margin-bottom:4px}.sub{color:var(--mu);margin:0 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(min-width:820px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{border:1px solid var(--gd);border-radius:14px;padding:14px;background:var(--panel)}
.st small{color:var(--mu)}.st div{font:800 28px Orbitron,sans-serif;margin-top:4px}
.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:14px}
.empty{color:var(--mu);text-align:center;padding:26px 0}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li small{color:var(--mu);display:block}
.li button.rm{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--err)}
.grid2{display:grid;gap:14px}
@media(min-width:980px){.grid2{grid-template-columns:1fr 1fr}}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
@media(max-width:819px){.burger{display:inline-block}}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--mu);font-weight:500}
.tw{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.hero .chat{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 60px #1fff1f40}}}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<main id="v"></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};
const get=(k,d)=>{try{const v=localStorage.getItem('rp_'+k);return v?JSON.parse(v):d}catch(e){return mem[k]??d}};
const set=(k,v)=>{try{localStorage.setItem('rp_'+k,JSON.stringify(v))}catch(e){mem[k]=v}};
const brand='<span class="brand">REPLI<b>NITY</b></span>';

const homeKB=[
 {k:'price,cost,how much,pricing,plan,rand',a:'Starter is R499/month, Growth R999/month and Pro R1,800/month. No contracts, cancel anytime.'},
 {k:'whatsapp,connect,link number',a:'Yes! Replinity connects to your business WhatsApp so customers get instant answers 24/7.'},
 {k:'setup,start,how long,install,onboard',a:'Setup takes under a day. You add your business info, we train your assistant, and you go live.'},
 {k:'language,zulu,afrikaans,xhosa,sotho,english',a:'Your assistant can reply in English, Zulu, Afrikaans and more, matching your customer.'},
 {k:'human,person,owner,speak to',a:'Anything the AI is unsure about is flagged in your inbox so you can step in.'},
 {k:'hello,hi,hey,howzit,sawubona',a:'Howzit! I\'m the Replinity assistant. Ask me about pricing, WhatsApp or setup.'}];
const defKB=[
 {k:'hours,open,close,time',a:'We\'re open Monday to Saturday, 8am to 6pm.'},
 {k:'price,cost,how much,quote',a:'Prices depend on what you need. Tell us what you\'re looking for and we\'ll send a quote.'},
 {k:'where,location,address,directions',a:'Add your address in AI Knowledge and your customers will get it instantly.'},
 {k:'book,booking,appointment,reserve',a:'Sure, send your preferred date and time and we\'ll confirm.'},
 {k:'hello,hi,hey,howzit,sawubona',a:'Howzit! How can we help you today?'}];

function reply(kb,q){
 q=q.toLowerCase();let best=null,bs=0;
 for(const e of kb){let s=0;e.k.split(',').forEach(w=>{w=w.trim().toLowerCase();if(w&&q.includes(w))s+=w.length});if(s>bs){bs=s;best=e}}
 return best?{x:best.a,fb:false}:{x:'Thanks for your message. I\'ve passed this to the team and they\'ll get back to you soon.',fb:true};
}

/* chat widget */
function chat(root,kb,o){
 o=o||{};let id=null;
 root.innerHTML='<div class="hd"><span class="dot"></span>'+esc(o.title||'Assistant')+'</div><div class="msgs" aria-live="polite"></div><form><input aria-label="Message" placeholder="Type a message…" autocomplete="off"><button class="btn sm">Send</button></form>';
 const box=root.querySelector('.msgs'),inp=root.querySelector('input');
 const add=(f,x)=>{const d=document.createElement('div');d.className='m '+f;d.textContent=x;box.append(d);box.scrollTop=box.scrollHeight};
 add('b',o.greet||'Howzit! Ask me anything.');
 root.querySelector('form').onsubmit=e=>{
  e.preventDefault();const q=inp.value.trim();if(!q)return;inp.value='';add('u',q);
  if(o.save){const c=get('chats',[]);let ch=c.find(z=>z.id===id);if(!ch){id=Date.now();ch={id,name:'Test chat '+(c.length+1),msgs:[]};c.unshift(ch)}ch.msgs.push({f:'u',x:q,t:Date.now()});set('chats',c)}
  setTimeout(()=>{const r=reply(kb(),q);add('b',r.x);
   if(o.save){const c=get('chats',[]);const ch=c.find(z=>z.id===id);if(ch){ch.msgs.push({f:'b',x:r.x,t:Date.now(),fb:r.fb});set('chats',c)}}},450);
 };
}

/* header */
function hdr(){
 const u=get('session',null);
 $('#hdr').innerHTML=brand+'<nav>'+(u?'<button class="btn sm" data-go="app">Dashboard</button>':'<a href="#pricing" data-go="home" data-hash="pricing">Pricing</a><button class="btn ghost sm" data-go="login">Log in</button><button class="btn sm" data-go="signup">Get started</button>')+'</nav>';
}

/* views */
function home(){
 $('#v').innerHTML=`<div class="wrap"><section class="hero"><div><h1>Never miss a <span>customer</span> again.</h1><p>Replinity is an AI assistant for South African small businesses. It answers your customers on WhatsApp and your website, day and night, in their language.</p><div class="row"><button class="btn" data-go="signup">Start free</button><button class="btn ghost" data-go="login">Log in</button></div></div><div class="chat" id="demo"></div></section>
 <section class="sec"><h2>What you get</h2><div class="feat">
 <div><b>Instant replies</b><span>Customers get answers in seconds, even at 2am or during load shedding.</span></div>
 <div><b>Shared inbox</b><span>See every conversation in one place and jump in when it matters.</span></div>
 <div><b>Your own AI knowledge</b><span>Teach the assistant your prices, hours and policies. No code needed.</span></div>
 <div><b>Customer list</b><span>Every person who messages you is saved automatically.</span></div></div></section>
 <section class="sec" id="pricing"><h2>Pricing</h2><div class="plans">
 <div class="plan"><h3>Starter</h3><div class="pr">R499</div><small>per month</small><ul><li>1 WhatsApp number</li><li>500 chats a month</li></ul><button class="btn ghost" data-go="signup">Choose Starter</button></div>
 <div class="plan hot"><h3>Growth</h3><div class="pr">R999</div><small>per month</small><ul><li>2 numbers</li><li>2,000 chats a month</li><li>Automations</li></ul><button class="btn" data-go="signup">Choose Growth</button></div>
 <div class="plan"><h3>Pro</h3><div class="pr">R1,800</div><small>per month</small><ul><li>Unlimited chats</li><li>Custom training</li><li>Priority support</li></ul><button class="btn ghost" data-go="signup">Choose Pro</button></div></div></section></div>
 <footer>© ${new Date().getFullYear()} Replinity · Made in South Africa</footer>`;
 chat($('#demo'),()=>homeKB,{title:'Replinity Assistant',greet:'Howzit! Ask me about pricing, WhatsApp or setup.'});
}

function auth(mode){
 const su=mode==='signup';
 $('#v').innerHTML=`<form class="auth" id="af"><h2>${su?'Create account':'Welcome back'}</h2><p>${su?'Set up your assistant in minutes.':'Log in to your dashboard.'}</p>
 ${su?'<label for="bn">Business name</label><input class="fld" id="bn" required>':''}
 <label for="em">Email</label><input class="fld" id="em" type="email" required autocomplete="email">
 <label for="pw">Password</label><input class="fld" id="pw" type="password" minlength="6" required autocomplete="${su?'new-password':'current-password'}">
 <div class="err" id="er" role="alert"></div><button class="btn" style="width:100%;margin-top:6px">${su?'Create account':'Log in'}</button>
 <p style="margin-top:14px">${su?'Already have an account?':'New here?'} <button type="button" class="lnk" data-go="${su?'login':'signup'}">${su?'Log in':'Create account'}</button></p></form>`;
 $('#af').onsubmit=async e=>{
  e.preventDefault();const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,us=get('users',[]);
  const h=await hash(pw);
  if(su){if(us.find(x=>x.em===em))return $('#er').textContent='That email already has an account. Log in instead.';
   const u={em,h,biz:$('#bn').value.trim()};us.push(u);set('users',us);set('session',{em,biz:u.biz});go('app')}
  else{const u=us.find(x=>x.em===em&&x.h===h);if(!u)return $('#er').textContent='Wrong email or password. Check and try again.';set('session',{em,biz:u.biz});go('app')}
 };
}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}

const tabs=[['dash','Dashboard'],['inbox','Inbox'],['cust','Customers'],['kb','AI Knowledge'],['test','Chat Tester'],['set','Settings']];
let tab='dash',openChat=null;
function app(){
 const u=get('session',null);if(!u)return go('login');
 $('#v').innerHTML=`<div class="app"><aside class="side" id="sd">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}<button data-act="out">Log out</button><div class="adm"><b>${esc(u.biz||'Your business')}</b><br>${esc(u.em)}</div></aside><section class="main"><button class="burger" data-act="menu">Menu</button><div id="pane"></div></section></div>`;
 pane();
}
function pane(){
 const p=$('#pane'),chats=get('chats',[]),kb=get('kb',defKB),cf=get('cfg',{bot:'Replinity Assistant',greet:'Howzit! How can we help you today?'}),u=get('session');
 const day=new Date().toDateString();
 if(tab==='dash'){
  const all=chats.flatMap(c=>c.msgs),today=all.filter(m=>new Date(m.t).toDateString()===day).length,bot=all.filter(m=>m.f==='b'),ok=bot.filter(m=>!m.fb).length;
  const act=all.slice().sort((a,b)=>b.t-a.t).slice(0,5);
  p.innerHTML=`<h2>Dashboard</h2><p class="sub">Never miss a customer. Here's your snapshot.</p><div class="stats"><div class="st"><small>Total customers</small><div>${chats.length}</div></div><div class="st"><small>Messages today</small><div>${today}</div></div><div class="st"><small>AI answered</small><div>${ok}</div></div><div class="st"><small>Needs you</small><div>${bot.length-ok}</div></div></div>
  <div class="box"><h3 style="margin-bottom:8px">Recent activity</h3>${act.length?act.map(m=>`<div class="li"><div>${esc(m.x.slice(0,80))}<small>${m.f==='u'?'Customer':m.f==='o'?'You':'AI'} · ${new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join(''):'<div class="empty">No activity yet. Try the Chat Tester.</div>'}</div>`;
 }
 if(tab==='inbox'){
  const c=chats.find(x=>x.id===openChat);
  p.innerHTML=`<h2>Inbox</h2><p class="sub">Every conversation your assistant has.</p><div class="grid2"><div class="box">${chats.length?chats.map(x=>`<div class="li"><div><b>${esc(x.name)}</b><small>${esc(x.msgs.at(-1).x.slice(0,50))}</small></div><button class="btn ghost sm" data-open="${x.id}">Open</button></div>`).join(''):'<div class="empty">No conversations yet.</div>'}</div>
  <div class="box">${c?`<h3>${esc(c.name)}</h3><div class="msgs" style="max-height:300px">${c.msgs.map(m=>`<div class="m ${m.f}">${esc(m.x)}</div>`).join('')}</div><form id="rf" class="row" style="margin-top:10px"><input class="fld" id="ri" placeholder="Reply as owner…" style="flex:1"><button class="btn sm">Send</button></form>`:'<div class="empty">Pick a conversation.</div>'}</div></div>`;
  const rf=$('#rf');if(rf)rf.onsubmit=e=>{e.preventDefault();const v=$('#ri').value.trim();if(!v)return;c.msgs.push({f:'o',x:v,t:Date.now()});set('chats',chats);pane()};
 }
 if(tab==='cust'){
  p.innerHTML=`<h2>Customers</h2><p class="sub">People who have messaged your assistant.</p><div class="box tw">${chats.length?`<table><tr><th>Name</th><th>Messages</th><th>Last seen</th></tr>${chats.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.msgs.length}</td><td>${new Date(x.msgs.at(-1).t).toLocaleDateString()}</td></tr>`).join('')}</table>`:'<div class="empty">No customers yet.</div>'}</div>`;
 }
 if(tab==='kb'){
  p.innerHTML=`<h2>AI Knowledge</h2><p class="sub">Teach your assistant. It replies when a customer's message contains one of the keywords.</p><div class="grid2"><div class="box"><h3 style="margin-bottom:6px">Add an answer</h3><form id="kf"><label for="kk">Keywords (comma separated)</label><input class="fld" id="kk" placeholder="delivery, shipping" required><label for="ka">Answer</label><textarea class="fld" id="ka" rows="3" required></textarea><button class="btn" style="margin-top:12px">Save answer</button></form></div>
  <div class="box"><h3 style="margin-bottom:6px">Saved answers (${kb.length})</h3>${kb.map((e,i)=>`<div class="li"><div><b>${esc(e.k)}</b><small>${esc(e.a)}</small></div><button class="rm" data-del="${i}" aria-label="Delete">Delete</button></div>`).join('')||'<div class="empty">Nothing saved yet.</div>'}</div></div>`;
  $('#kf').onsubmit=e=>{e.preventDefault();kb.push({k:$('#kk').value.trim(),a:$('#ka').value.trim()});set('kb',kb);pane()};
 }
 if(tab==='test'){
  p.innerHTML=`<h2>Chat Tester</h2><p class="sub">Talk to your assistant like a customer. Chats appear in your Inbox.</p><div class="chat" id="tc" style="max-width:520px"></div>`;
  chat($('#tc'),()=>get('kb',defKB),{save:true,title:cf.bot,greet:cf.greet});
 }
 if(tab==='set'){
  p.innerHTML=`<h2>Settings</h2><p class="sub">Name and greet your assistant.</p><form class="box" id="sf" style="max-width:520px"><label for="s1">Assistant name</label><input class="fld" id="s1" value="${esc(cf.bot)}"><label for="s2">Greeting</label><input class="fld" id="s2" value="${esc(cf.greet)}"><label for="s3">Business WhatsApp number</label><input class="fld" id="s3" placeholder="+27 ..." value="${esc(cf.wa||'')}"><p class="sub" style="margin-top:10px;font-size:14px">Number is saved for later. Live WhatsApp needs the Replinity server.</p><button class="btn">Save settings</button></form>`;
  $('#sf').onsubmit=e=>{e.preventDefault();set('cfg',{bot:$('#s1').value,greet:$('#s2').value,wa:$('#s3').value});alert('Saved')};
 }
}

function go(v){
 hdr();
 if(v==='home')home();else if(v==='login'||v==='signup')auth(v);else app();
 scrollTo(0,0);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-tab],[data-act],[data-open],[data-del]');if(!t)return;
 if(t.dataset.go){if(t.tagName==='A')e.preventDefault();go(t.dataset.go);if(t.dataset.hash)setTimeout(()=>document.getElementById(t.dataset.hash)?.scrollIntoView(),30)}
 else if(t.dataset.tab){tab=t.dataset.tab;app()}
 else if(t.dataset.open){openChat=+t.dataset.open;pane()}
 else if(t.dataset.del!==undefined){const k=get('kb',defKB);k.splice(+t.dataset.del,1);set('kb',k);pane()}
 else if(t.dataset.act==='menu')$('#sd').classList.toggle('open');
 else if(t.dataset.act==='out'){set('session',null);go('home')}
});
$('#hdr').addEventListener('click',e=>{if(e.target.closest('.brand'))go(get('session',null)?'app':'home')});
go(get('session',null)?'app':'home');
</script>
</body>
</html>
