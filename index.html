<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Replinity | Never Miss A Customer Again</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================================================
   REPLINITY — WAITLIST LANDING PAGE
   ========================================================= */

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
    scroll-behavior:smooth;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#070707;
    color:#fff;
    overflow-x:hidden;
}

::selection{
    background:#39ff14;
    color:#000;
}

button,
input,
textarea{
    font-family:'Orbitron',sans-serif;
}

.cursor{
    position:fixed;
    width:220px;
    height:220px;
    background:radial-gradient(
        circle,
        rgba(57,255,20,.22),
        transparent 70%
    );
    pointer-events:none;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:9999;
    filter:blur(35px);
    transition:.05s;
}

.backgroundLogo{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:12vw;
    font-weight:900;
    opacity:.025;
    letter-spacing:8px;
    pointer-events:none;
    user-select:none;
    z-index:-2;
    white-space:nowrap;
}

.backgroundLogo span{
    color:#39ff14;
    text-shadow:0 0 30px #39ff14;
}


/* =========================
   TOP HEADER
========================= */

.topHeader{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:80px;
    background:rgba(7,7,7,.94);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid #222;
    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand h1{
    font-size:34px;
    font-weight:900;
    color:#fff;
}

.brand h1 span{
    color:#39ff14;
    text-shadow:
        0 0 10px #39ff14,
        0 0 25px #39ff14;
}

.header-logo{
    width:58px;
    height:58px;
    object-fit:contain;
}

.topLine{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:2px;
    background:#39ff14;
    box-shadow:
        0 0 15px #39ff14,
        0 0 30px rgba(57,255,20,.5);
}


/* =========================
   MENU
========================= */

.menuBtn{
    display:none;
    background:#39ff14;
    color:#000;
    border:none;
    width:52px;
    height:52px;
    border-radius:12px;
    font-size:28px;
    cursor:pointer;
    margin-right:15px;
    flex-shrink:0;
    transition:.2s;
}

.menuBtn:hover{
    box-shadow:
        0 0 15px #39ff14,
        0 0 35px rgba(57,255,20,.4);
}

.menuBtn:active{
    transform:scale(.88);
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    top:80px;
    left:0;
    width:280px;
    height:calc(100vh - 80px);
    transform:translateX(-100%);
    background:rgba(5,5,5,.97);
    backdrop-filter:blur(18px);
    border-right:1px solid #222;
    transition:transform .4s ease;
    z-index:998;
    overflow-y:auto;
}

.sidebar.active{
    transform:translateX(0);
}

.sidebar-logo{
    display:flex;
    justify-content:center;
    margin:30px 0 20px;
}

.sidebar-logo img{
    width:90px;
    height:90px;
    object-fit:contain;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.sidebar h2 span{
    color:#39ff14;
    text-shadow:0 0 15px #39ff14;
}

.sidebar a{
    display:block;
    padding:18px 30px;
    color:#fff;
    text-decoration:none;
    border-left:3px solid transparent;
    transition:.3s;
}

.sidebar a:hover{
    background:#181818;
    border-left-color:#39ff14;
    padding-left:40px;
    box-shadow:0 0 15px rgba(57,255,20,.25);
}

.sidebar-status{
    margin:30px 20px;
    padding:15px;
    border:1px solid #222;
    border-radius:12px;
    background:#0d0d0d;
}

.sidebar-status small{
    color:#777;
}

.sidebar-status strong{
    display:block;
    margin-top:6px;
    color:#39ff14;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    padding:150px 25px 80px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(57,255,20,.09),
        transparent 70%
    );
    filter:blur(20px);
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:900px;
}

.launch-pill{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:10px 18px;
    border:1px solid rgba(57,255,20,.4);
    border-radius:50px;
    color:#39ff14;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:25px;
    background:rgba(57,255,20,.04);
    box-shadow:0 0 25px rgba(57,255,20,.08);
}

.launch-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#39ff14;
    box-shadow:0 0 12px #39ff14;
    animation:pulseDot 1.5s infinite;
}

@keyframes pulseDot{

    0%,100%{
        opacity:.35;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }
}

.hero h1{
    font-size:clamp(42px,7vw,78px);
    margin-bottom:25px;
    line-height:1.05;
}

.hero h1 span{
    color:#39ff14;
    text-shadow:
        0 0 15px #39ff14,
        0 0 35px rgba(57,255,20,.5);
}

.hero p{
    font-size:19px;
    color:#aaa;
    max-width:760px;
    margin:0 auto;
    line-height:1.8;
}

.hero-sub{
    margin-top:18px;
    color:#666;
    font-size:13px;
}

.hero-actions{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}


/* =========================
   BUTTONS
========================= */

.btn{
    display:inline-block;
    margin-top:30px;
    padding:17px 38px;
    background:#39ff14;
    color:#000;
    border:none;
    border-radius:12px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    text-decoration:none;
    transition:.25s;
    box-shadow:0 0 20px rgba(57,255,20,.15);
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:
        0 0 25px #39ff14,
        0 0 55px rgba(57,255,20,.25);
}

.btn.secondary{
    background:transparent;
    color:#fff;
    border:1px solid #333;
}

.btn.secondary:hover{
    border-color:#39ff14;
    color:#39ff14;
}


/* =========================
   SECTIONS
========================= */

.section{
    padding:110px 60px;
    text-align:center;
    position:relative;
}

.section h2{
    font-size:clamp(34px,5vw,52px);
    margin-bottom:20px;
}

.section > p{
    color:#999;
    margin-bottom:45px;
    line-height:1.8;
}


/* =========================
   FEATURES
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
    max-width:1200px;
    margin:40px auto 0;
}

.card,
.priceCard{
    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.98),
            rgba(10,10,10,.98)
        );
    border:1px solid #222;
    border-radius:18px;
    padding:32px 25px;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.card::before,
.priceCard::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:1px;
    background:#39ff14;
    box-shadow:0 0 15px #39ff14;
    transition:.6s;
}

.card:hover::before,
.priceCard:hover::before{
    left:100%;
}

.card:hover,
.priceCard:hover{
    transform:translateY(-8px);
    border-color:#39ff14;
    box-shadow:0 0 30px rgba(57,255,20,.12);
}

.card h3,
.priceCard h3{
    margin-bottom:15px;
}

.card p,
.priceCard p{
    color:#999;
    line-height:1.7;
    font-size:14px;
}


/* =========================
   PRICING
========================= */

.priceCard h1{
    font-size:42px;
    color:#39ff14;
    margin:15px 0;
}

.priceCard span{
    color:#777;
}

.price-status{
    display:inline-block;
    margin-top:22px;
    padding:7px 12px;
    border:1px solid #333;
    border-radius:30px;
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
}

.locked-card{
    opacity:.82;
}

.lock-icon{
    position:absolute;
    top:15px;
    right:15px;
    font-size:18px;
    color:#555;
}


/* =========================
   WAITLIST
========================= */

.waitlist-section{
    padding:120px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            rgba(57,255,20,.08),
            transparent 60%
        );
}

.waitlist-box{
    max-width:850px;
    margin:auto;
    padding:60px 35px;
    background:rgba(12,12,12,.9);
    border:1px solid rgba(57,255,20,.22);
    border-radius:25px;
    box-shadow:
        0 0 70px rgba(57,255,20,.06),
        inset 0 0 40px rgba(57,255,20,.025);
    position:relative;
    overflow:hidden;
}

.waitlist-box::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:#39ff14;
    box-shadow:0 0 20px #39ff14;
}

.waitlist-badge{
    display:inline-block;
    color:#39ff14;
    border:1px solid rgba(57,255,20,.35);
    padding:9px 15px;
    border-radius:30px;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:22px;
}

.waitlist-box h2{
    font-size:clamp(35px,6vw,60px);
    margin-bottom:20px;
}

.waitlist-box h2 span{
    color:#39ff14;
    text-shadow:0 0 20px #39ff14;
}

.waitlist-box > p{
    color:#aaa;
    max-width:700px;
    margin:0 auto 35px;
    line-height:1.8;
}

.waitlist-reasons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:35px;
}

.reason{
    background:#101010;
    border:1px solid #222;
    padding:18px;
    border-radius:13px;
}

.reason strong{
    display:block;
    color:#39ff14;
    margin-bottom:7px;
    font-size:12px;
}

.reason span{
    color:#777;
    font-size:11px;
    line-height:1.5;
}

#waitlistForm{
    max-width:650px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:15px;
}

#waitlistForm input{
    width:100%;
    padding:18px;
    background:#080808;
    border:1px solid #292929;
    border-radius:12px;
    color:#fff;
    font-size:14px;
    outline:none;
    transition:.3s;
}

#waitlistForm input:focus{
    border-color:#39ff14;
    box-shadow:0 0 18px rgba(57,255,20,.25);
}

#waitlistForm input::placeholder{
    color:#666;
}

.waitlist-submit{
    padding:18px;
    border:none;
    border-radius:12px;
    background:#39ff14;
    color:#000;
    font-weight:900;
    cursor:pointer;
    transition:.25s;
}

.waitlist-submit:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(57,255,20,.5);
}

.waitlist-note{
    color:#555;
    font-size:10px;
    margin-top:15px;
    line-height:1.6;
}

.form-message{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    border:1px solid rgba(57,255,20,.3);
    background:rgba(57,255,20,.05);
    color:#39ff14;
    font-size:12px;
}


/* =========================
   FOUNDING / FUNDING
========================= */

.founding-section{
    padding:120px 20px;
    background:
        radial-gradient(
            circle at top,
            #102010 0%,
            #050505 45%,
            #050505 100%
        );
    color:white;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.founding-section::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            transparent 49%,
            rgba(57,255,136,.025) 50%,
            transparent 51%
        );
    background-size:80px 80px;
    pointer-events:none;
}

.founding-header{
    max-width:850px;
    margin:0 auto 65px;
    position:relative;
    z-index:1;
}

.founding-badge{
    display:inline-block;
    padding:10px 20px;
    border:1px solid #39ff88;
    border-radius:50px;
    color:#39ff88;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:22px;
    box-shadow:0 0 20px rgba(57,255,136,.12);
}

.founding-header h2{
    font-size:clamp(34px,6vw,62px);
    margin-bottom:22px;
    line-height:1.1;
}

.founding-header h2 span{
    color:#39ff88;
    text-shadow:0 0 20px rgba(57,255,136,.35);
}

.founding-header p{
    color:#aaa;
    font-size:16px;
    line-height:1.8;
    max-width:750px;
    margin:auto;
}

.founding-plans{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    position:relative;
    z-index:1;
}

.founding-card{
    position:relative;
    padding:42px 30px 32px;
    background:rgba(13,13,13,.95);
    border:1px solid #252525;
    border-radius:22px;
    text-align:left;
    transition:.3s ease;
    overflow:hidden;
}

.founding-card::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:2px;
    background:#39ff88;
    opacity:.35;
}

.founding-card:hover{
    transform:translateY(-10px);
    border-color:#39ff88;
    box-shadow:0 0 40px rgba(57,255,136,.15);
}

.founding-card.featured{
    border:1px solid #39ff88;
    box-shadow:0 0 35px rgba(57,255,136,.1);
    transform:translateY(-8px);
}

.popular-badge{
    position:absolute;
    top:0;
    right:25px;
    background:#39ff88;
    color:#000;
    padding:8px 14px;
    border-radius:0 0 12px 12px;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
}

.plan-label{
    color:#39ff88;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:12px;
}

.founding-card h3{
    font-size:28px;
    margin-bottom:15px;
}

.price{
    margin-bottom:5px;
}

.price span{
    font-size:42px;
    font-weight:900;
    color:#fff;
}

.price-note{
    color:#888;
    font-size:13px;
    margin-bottom:30px;
}

.discount-box{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    margin-bottom:25px;
    border-radius:8px;
    background:rgba(57,255,136,.08);
    border:1px solid rgba(57,255,136,.2);
    color:#39ff88;
    font-size:11px;
    font-weight:800;
}

.founding-card ul{
    list-style:none;
    padding:0;
    margin:0 0 30px;
}

.founding-card li{
    color:#ccc;
    margin-bottom:14px;
    font-size:14px;
    line-height:1.5;
}

.funding-btn{
    display:block;
    width:100%;
    padding:17px 12px;
    background:#39ff88;
    color:#000;
    text-decoration:none;
    text-align:center;
    border-radius:12px;
    font-weight:900;
    font-size:13px;
    transition:.25s;
}

.funding-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(57,255,136,.35);
}

.founding-security{
    margin-top:38px;
    color:#777;
    font-size:13px;
}


/* =========================
   HOW / ABOUT / VISION
========================= */

.about-section,
.how-section,
.vision-section,
.policy-section{
    max-width:1100px;
    margin:100px auto;
    padding:0 25px;
}

.about-section h2,
.how-section h2,
.vision-section h2,
.policy-section h2{
    text-align:center;
    font-size:2.2rem;
    color:#00ff88;
    margin-bottom:30px;
}

.about-section p,
.vision-section p{
    text-align:center;
    font-size:1.05rem;
    line-height:1.8;
    color:#ccc;
    max-width:850px;
    margin:20px auto;
}

.step{
    display:flex;
    align-items:center;
    gap:20px;
    background:#111;
    border:1px solid rgba(0,255,136,.2);
    padding:20px;
    border-radius:14px;
    margin:15px 0;
}

.step span{
    min-width:45px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#00ff88;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.step p{
    color:#ddd;
    font-size:1rem;
    line-height:1.6;
}


/* =========================
   FEEDBACK
========================= */

.feedback-section{
    padding:120px 20px;
    text-align:center;
    background:
        radial-gradient(
            circle at center,
            rgba(57,255,20,.05),
            transparent 65%
        );
}

.feedback-section h2{
    font-size:clamp(35px,6vw,55px);
    margin-bottom:15px;
}

.feedback-section > p{
    color:#888;
    margin-bottom:40px;
}

#feedbackForm{
    max-width:650px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
}

#feedbackForm input,
#feedbackForm textarea{
    width:100%;
    padding:18px;
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    color:#fff;
    font-size:14px;
    outline:none;
    transition:.3s;
}

#feedbackForm textarea{
    min-height:160px;
    resize:vertical;
}

#feedbackForm input:focus,
#feedbackForm textarea:focus{
    border-color:#39ff14;
    box-shadow:0 0 18px rgba(57,255,20,.25);
}

#feedbackForm input::placeholder,
#feedbackForm textarea::placeholder{
    color:#666;
}

.feedback-submit{
    padding:17px;
    background:#39ff14;
    border:none;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
}

.feedback-note{
    color:#555;
    margin-top:20px;
    font-size:11px;
}


/* =========================
   FOUNDER
========================= */

.founder-section{
    padding:120px 25px 80px;
    text-align:center;
    background:
        radial-gradient(
            circle at center,
            rgba(57,255,20,.07),
            transparent 55%
        );
}

.founder-label{
    color:#777;
    font-size:16px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:18px;
    text-transform:uppercase;
}

.founder-name{
    font-size:clamp(48px,8vw,82px);
    font-weight:900;
    line-height:1;
}

.founder-name .eson{
    color:#fff;
}

.founder-name .zepe{
    color:#39ff14;
    text-shadow:
        0 0 10px #39ff14,
        0 0 25px #39ff14,
        0 0 50px rgba(57,255,20,.45);
}

.founder-line{
    width:90px;
    height:2px;
    background:#39ff14;
    margin:30px auto 0;
    box-shadow:0 0 15px #39ff14;
}


/* =========================================================
   AI CHAT ASSISTANT
========================================================= */

.chat-launcher{
    position:fixed;
    right:25px;
    bottom:25px;
    width:64px;
    height:64px;
    border-radius:50%;
    border:1px solid #39ff14;
    background:#090909;
    color:#39ff14;
    cursor:pointer;
    z-index:3000;
    box-shadow:
        0 0 15px rgba(57,255,20,.35),
        0 0 40px rgba(57,255,20,.12);
    font-size:24px;
    transition:.25s;
}

.chat-launcher:hover{
    transform:scale(1.08);
    box-shadow:
        0 0 25px #39ff14,
        0 0 60px rgba(57,255,20,.2);
}

.chat-ping{
    position:absolute;
    width:10px;
    height:10px;
    right:2px;
    top:2px;
    background:#39ff14;
    border-radius:50%;
    box-shadow:0 0 12px #39ff14;
}

.ai-chat{
    position:fixed;
    right:25px;
    bottom:100px;
    width:390px;
    max-width:calc(100vw - 30px);
    height:580px;
    background:#080808;
    border:1px solid #2b2b2b;
    border-radius:22px;
    overflow:hidden;
    z-index:2999;
    display:flex;
    flex-direction:column;
    box-shadow:
        0 0 40px rgba(0,0,0,.7),
        0 0 40px rgba(57,255,20,.08);
    transform:translateY(20px) scale(.95);
    opacity:0;
    pointer-events:none;
    transition:.3s ease;
}

.ai-chat.active{
    transform:translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
}


/* Animated AI background */

.ai-particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    opacity:.35;
}

.ai-particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#39ff14;
    box-shadow:0 0 10px #39ff14;
    animation:floatParticle linear infinite;
}

@keyframes
   floatParticle{
    from{
        transform:translateY(100%) translateX(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.7;
    }

    to{
        transform:translateY(-120%) translateX(40px);
        opacity:0;
    }
}


/* =========================
   AI CHAT HEADER
========================= */

.ai-header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid #222;

    align-items:center;

}

.ai-icon{

    display:flex;

    justify-content:center;

    color:#000;

}

.ai-title{
    text-align:left;
}

.ai-title strong{
    display:block;
    font-size:13px;

}

.ai-title span{

    color:#39ff14;

}

.ai-close{

.ai-close:hover{

/* =========================
   CHAT MESSAGES
========================= */

.ai-messages{
    position:relative;
    z-index:2;
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.ai-messages::-webkit-scrollbar{
    width:4px;
}

.ai-messages::-webkit-scrollbar-thumb{
    background:#39ff14;
    border-radius:10px;
}

.chat-message{
    max-width:85%;
    padding:13px 15px;
    border-radius:14px;
    font-size:12px;
    line-height:1.6;
    animation:messageIn .3s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.bot-message{
    align-self:flex-start;
    background:#111;
    border:1px solid #252525;
    color:#ccc;
    border-bottom-left-radius:4px;
}

.bot-message strong{
    color:#39ff14;
}

.user-message{
    align-self:flex-end;
    background:#39ff14;
    color:#000;
    font-weight:700;
    border-bottom-right-radius:4px;
}


/* =========================
   QUICK QUESTIONS
========================= */

.ai-quick{
    position:relative;
    z-index:2;
    display:flex;
    gap:8px;
    padding:0 15px 12px;
    overflow-x:auto;
}

.ai-quick::-webkit-scrollbar{
    display:none;
}

.quick-btn{
    flex-shrink:0;
    padding:9px 12px;
    border:1px solid #292929;
    border-radius:20px;
    background:#101010;
    color:#aaa;
    font-size:9px;
    cursor:pointer;
    transition:.2s;
}

.quick-btn:hover{
    border-color:#39ff14;
    color:#39ff14;
}


/* =========================
   CHAT INPUT
========================= */

.ai-input-area{
    position:relative;
    z-index:2;
    display:flex;
    gap:8px;
    padding:14px;
    border-top:1px solid #222;
    background:#0b0b0b;
}

.ai-input{
    flex:1;
    min-width:0;
    padding:13px 14px;
    border:1px solid #292929;
    border-radius:12px;
    outline:none;
    background:#111;
    color:#fff;
    font-size:11px;
}

.ai-input:focus{
    border-color:#39ff14;
    box-shadow:0 0 15px rgba(57,255,20,.15);
}

.ai-input::placeholder{
    color:#555;
}

.ai-send{
    width:46px;
    border:none;
    border-radius:12px;
    background:#39ff14;
    color:#000;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.ai-send:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(57,255,20,.4);
}


/* =========================
   TYPING INDICATOR
========================= */

.typing{
    display:flex;
    align-items:center;
    gap:4px;
    padding:12px 15px;
    width:max-content;
}

.typing span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#39ff14;
    box-shadow:0 0 7px #39ff14;
    animation:typingDot 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typingDot{
    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-3px);
    }
}


/* =========================

========================= */

footer{
    padding:60px 25px 35px;

    border-top:1px solid #1c1c1c;

}

.footer-brand{
    font-size:25px;

Then after the closing "</style>", add this JavaScript before "</body>":

<script>

/* =========================
   CURSOR GLOW
========================= */

const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {

    if(cursor){
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    }

});


/* =========================
   MOBILE MENU
========================= */

const menuBtn = document.querySelector(".menuBtn");
const sidebar = document.querySelector(".sidebar");
const overlay = document.querySelector(".sidebar-overlay");

function toggleMenu(){

    if(!sidebar) return;

    sidebar.classList.toggle("active");

    if(overlay){
        overlay.classList.toggle("active");
    }

}

if(menuBtn){
    menuBtn.addEventListener("click", toggleMenu);
}

if(overlay){
    overlay.addEventListener("click", toggleMenu);
}

document.querySelectorAll(".sidebar a").forEach(link => {

    link.addEventListener("click", () => {

        sidebar.classList.remove("active");

        if(overlay){
            overlay.classList.remove("active");
        }

    });

});


/* =========================
   AI CHAT
========================= */

const chatLauncher = document.querySelector(".chat-launcher");
const aiChat = document.querySelector(".ai-chat");
const aiClose = document.querySelector(".ai-close");

if(chatLauncher){

    chatLauncher.addEventListener("click", () => {
        aiChat.classList.toggle("active");
    });

}

if(aiClose){

    aiClose.addEventListener("click", () => {
        aiChat.classList.remove("active");
    });

}


/* =========================
   AI PARTICLES
========================= */

const particleContainer = document.querySelector(".ai-particles");

if(particleContainer){

    for(let i = 0; i < 24; i++){

        const particle = document.createElement("span");

        particle.className = "ai-particle";

        particle.style.left = Math.random() * 100 + "%";

        particle.style.bottom = "-10px";

        particle.style.animationDuration =
            (5 + Math.random() * 8) + "s";

        particle.style.animationDelay =
            (Math.random() * 6) + "s";

        particleContainer.appendChild(particle);

    }

}


/* =========================
   AI KNOWLEDGE
========================= */

const aiKnowledge = {

    pricing:
    "Replinity is launching with simple plans designed for growing businesses. Pricing is currently locked until launch, so joining the waitlist is the best way to stay informed.",

    founder:
    "Replinity was founded and is led by Esona Zepe, Founder & CEO.",

    waitlist:
    "The Replinity waitlist gives early supporters the opportunity to hear about launch updates and early access before the wider public.",

    replinity:
    "Replinity is an AI customer-response platform designed to help businesses respond to customers faster and avoid missed opportunities.",

    features:
    "Replinity is being built around AI-assisted customer replies, customer management, business information, analytics and tools that help businesses stay responsive.",

    launch:
    "Replinity is currently preparing for launch. Exact launch timing will be announced through official Replinity updates.",

    funding:
    "Early funding opportunities may be available for supporters who want to help Replinity grow before launch. Check the funding section for the current offer.",

    contact:
    "You can use the feedback section on this page to share ideas, questions or suggestions with the Replinity team."

};


/* =========================
   AI RESPONSE
========================= */

function getAIResponse(question){

    const q = question.toLowerCase();

    if(
        q.includes("price") ||
        q.includes("cost") ||
        q.includes("how much")
    ){
        return aiKnowledge.pricing;
    }

    if(
        q.includes("founder") ||
        q.includes("ceo") ||
        q.includes("who made") ||
        q.includes("owner")
    ){
        return aiKnowledge.founder;
    }

    if(
        q.includes("waitlist") ||
        q.includes("join")
    ){
        return aiKnowledge.waitlist;
    }

    if(
        q.includes("what is replinity") ||
        q.includes("what is this") ||
        q.includes("replinity")
    ){
        return aiKnowledge.replinity;
    }

    if(
        q.includes("feature") ||
        q.includes("does it do") ||
        q.includes("capabilities")
    ){
        return aiKnowledge.features;
    }

    if(
        q.includes("launch") ||
        q.includes("release")
    ){
        return aiKnowledge.launch;
    }

    if(
        q.includes("fund") ||
        q.includes("support")
    ){
        return aiKnowledge.funding;
    }

    if(
        q.includes("contact") ||
        q.includes("email") ||
        q.includes("feedback")
    ){
        return aiKnowledge.contact;
    }

    return "I'm the Replinity information assistant. Ask me about Replinity, the waitlist, features, launch, pricing, funding or the founder.";
}


/* =========================
   SEND MESSAGE
========================= */

const aiInput = document.querySelector(".ai-input");
const aiSend = document.querySelector(".ai-send");
const aiMessages = document.querySelector(".ai-messages");

function addMessage(text, type){

    if(!aiMessages) return;

    const message = document.createElement("div");

    message.className =
        "chat-message " +
        (type === "user"
            ? "user-message"
            : "bot-message");

    message.textContent = text;

    aiMessages.appendChild(message);

    aiMessages.scrollTop =
        aiMessages.scrollHeight;

}


function sendAIMessage(){

    if(!aiInput) return;

    const question =
        aiInput.value.trim();

    if(!question) return;

    addMessage(question, "user");

    aiInput.value = "";

    setTimeout(() => {

        const response =
            getAIResponse(question);

        addMessage(response, "bot");

    }, 600);

}


if(aiSend){

    aiSend.addEventListener(
        "click",
        sendAIMessage
    );

}


if(aiInput){

    aiInput.addEventListener(
        "keydown",
        (e) => {

            if(e.key === "Enter"){
                sendAIMessage();
            }

        }
    );

}


/* =========================
   QUICK QUESTIONS
========================= */

document.querySelectorAll(".quick-btn").forEach(button => {

    button.addEventListener("click", () => {

        const question =
            button.textContent.trim();

        if(aiInput){

            aiInput.value = question;

            sendAIMessage();

        }

    });

});


/* =========================
   WAITLIST FORM
========================= */

const waitlistForm =
    document.getElementById("waitlistForm");

if(waitlistForm){

    waitlistForm.addEventListener("submit", (e) => {

        e.preventDefault();

        const message =
            document.querySelector(".form-message");

        if(message){

            message.style.display = "block";

            message.classList.add("success-pop");

            message.textContent =
                "You're on the Replinity waitlist. We'll keep you updated.";

        }

        waitlistForm.reset();

    });

}


/* =========================
   SMOOTH ANCHORS
========================= */

document.querySelectorAll('a[href^="#"]').forEach(anchor => {

    anchor.addEventListener("click", function(e){

        const target =
            document.querySelector(this.getAttribute("href"));

        if(target){

            e.preventDefault();

            target.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        }

    });

});

</script>

</body>
</html>
