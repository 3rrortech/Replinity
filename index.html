<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Replinity – Never Miss A Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#0c0c0c;--line:#1d261d;--g:#39ff14;--gd:#22b30e;--tx:#f4f4f4;--mu:#8c918c;--err:#ff5d5d;--hh:64px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px);-webkit-text-size-adjust:100%}
[id]{scroll-margin-top:calc(var(--hh) + 12px)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{flex:1;min-width:0;overflow-x:clip}
h1,h2,h3,.brand{font-family:Orbitron,"DM Sans",sans-serif;margin:0;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.brand{font-weight:800;font-size:22px;color:#fff}.brand b{color:var(--g)}
.btn{--d:5px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2;letter-spacing:0;background:linear-gradient(180deg,#2c3f27 0%,#15210f 50%,#0a1108 100%);color:var(--g);border:0;border-radius:14px;padding:13px 20px;font-weight:800;text-shadow:none;box-shadow:inset 0 0 0 2px #39ff14,inset 0 3px 0 #ffffff2e,inset 0 -4px 0 #00000066,0 var(--d) 0 #17820a,0 calc(var(--d) + 2px) 0 #0b3f05,0 calc(var(--d) + 9px) 14px #000000d9,0 0 22px #39ff1459;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:translateY(calc(var(--d) - 1px));box-shadow:inset 0 0 0 2px #39ff14,inset 0 3px 0 #ffffff22,inset 0 -2px 0 #00000066,0 1px 0 #17820a,0 4px 6px #000000d9,0 0 14px #39ff1440}
.btn.ghost{background:linear-gradient(180deg,#2e362e 0%,#191d19 55%,#101310 100%);color:var(--g);box-shadow:inset 0 0 0 1px #4f8f3e,inset 0 3px 0 #ffffff2e,inset 0 -3px 0 #0000005c,0 var(--d) 0 #1c3d16,0 calc(var(--d) + 2px) 0 #08160a,0 calc(var(--d) + 9px) 14px #000000d9}
.btn.ghost:active{box-shadow:inset 0 0 0 1px #4f8f3e,inset 0 3px 0 #ffffff22,inset 0 -2px 0 #0000005c,0 1px 0 #1c3d16,0 4px 6px #000000d9}
.btn.sm{--d:3px;padding:10px 15px;font-size:14px;border-radius:12px}
.btn.lg{width:100%;padding:18px;font-size:18px;border-radius:18px;--d:6px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* header */
header.top{position:sticky;top:0;z-index:30;background:rgba(5,5,5,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:2px solid var(--g);box-shadow:0 2px 18px #39ff1433}
header.top .in{max-width:1120px;height:var(--hh);margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lt{display:flex;align-items:center;gap:12px;min-width:0}
.bl{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.lg{width:40px;height:40px;border-radius:11px;background:#000;border:1px solid #1e3a18;overflow:hidden;flex:none}.lg img,.tile img{display:block;width:100%;height:100%;object-fit:cover}
.mb{display:none;width:46px;height:46px;border:0;background:none;flex:none;padding:0;place-content:center;gap:7px;transition:transform .08s}.mb:active{transform:translateY(3px)}
.mb span{display:block;width:28px;height:6px;border-radius:3px;background:linear-gradient(180deg,#b6ffa3,#39ff14 50%,#24d908);box-shadow:0 2px 0 #17820a,0 4px 0 #0f5a07,0 8px 7px #000000cc,0 0 12px #39ff1455}
.nv{display:flex;align-items:center;gap:6px}
.nl{background:none;border:0;color:var(--mu);padding:8px 10px;border-radius:10px;font-size:15px}
.nl:hover{color:var(--tx)}
@media(max-width:819px){
 .mb{display:grid}
 .nv{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px 18px;background:#050505;border-bottom:2px solid var(--g)}
 .nv.open{display:flex}
 .nl{text-align:left;padding:12px;font-size:16px}
 .nv .btn{padding:13px}
}

/* onboarding flow */
.flow{width:100%;max-width:520px;margin:0 auto;padding:40px 18px 28px;text-align:center}
.tile{width:120px;height:120px;border-radius:30px;background:#000;border:1px solid #1e3a18;overflow:hidden;margin:0 auto 16px;box-shadow:0 0 60px #39ff1440}
.tagline{color:var(--mu);margin:0 0 28px}
.steps{display:flex;align-items:center;margin:0 0 30px}
.steps .s{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid #2a2f2a;background:#000;display:grid;place-items:center;font:700 16px Orbitron,sans-serif;color:var(--mu)}
.steps .s.on{border-color:var(--gd);color:var(--g);box-shadow:0 0 16px #39ff1455}
.steps .s.done{background:var(--g);border-color:var(--g);color:#000}
.steps i{flex:1;height:2px;background:#232823}.steps i.fill{background:var(--g)}
.stepcard{min-height:430px;display:flex;flex-direction:column}
.flow h1{font-size:clamp(26px,6.4vw,36px);line-height:1.15;margin-bottom:14px}
.lead{color:var(--mu);margin:0 auto 26px;max-width:42ch;font-size:17px}
.frm{text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:#000;margin-bottom:8px}
.seg button{border:0;background:none;color:var(--mu);padding:11px 8px;border-radius:10px;font-weight:700}
.seg button.on{background:linear-gradient(180deg,#2c3f27,#15210f 55%,#0a1108);color:var(--g);box-shadow:inset 0 0 0 2px #39ff14,inset 0 3px 0 #ffffff2e,0 3px 0 #17820a,0 6px 8px #000000b3}
label{display:block;font-size:14px;color:var(--mu);margin:14px 0 4px}
.fld{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.fld:focus{border-color:var(--g);outline:none;box-shadow:0 0 0 3px #39ff1433}
.err{color:var(--err);font-size:14px;min-height:22px;margin:10px 0 8px}
.lnk{background:none;border:0;color:var(--g);padding:0;text-decoration:underline}
.back{margin-top:18px;text-align:center}

/* sections */
.sec{padding:44px 0;border-top:1px solid var(--line)}
.sec h2{font-size:26px;margin-bottom:8px;text-align:center}
.sec .sub2{color:var(--mu);text-align:center;margin:0 0 26px}
.feat{display:grid;gap:0}
.feat div{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.feat b{color:var(--g)}.feat span{color:var(--mu)}
@media(min-width:820px){.feat div{grid-template-columns:240px 1fr}}
.plans{display:grid;gap:16px}
@media(min-width:820px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{position:relative;display:flex;flex-direction:column;text-align:center;border:1px solid var(--line);border-radius:22px;padding:28px 20px 24px;background:var(--panel)}
.plan.hot{border-color:var(--g);box-shadow:0 0 30px #39ff1426}
.plan h3{color:var(--g);font-size:20px}
.plan .pr{font:800 clamp(38px,10vw,44px) Orbitron,sans-serif;color:var(--g);text-shadow:0 0 18px #39ff1466;margin:16px 0 4px}
.plan .su{color:var(--mu);font:600 15px Orbitron,sans-serif}
.plan .mo{color:var(--mu);font:600 17px Orbitron,sans-serif;margin-top:6px}
.plan .tg{position:absolute;top:16px;right:16px;background:var(--g);color:#000;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.plan ul{text-align:left;padding-left:20px;color:var(--mu);margin:18px 0 20px;flex:1}
.plan .btn{width:100%}
.pol{max-width:720px;margin:0 auto;border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel)}
.pol h3{color:var(--g);font-size:19px;margin-bottom:8px}
.pol p{margin:0;color:var(--mu)}

/* founder + footer */
.founder{position:relative;overflow:hidden;text-align:center;padding:72px 18px 64px;border-top:1px solid var(--line)}
.founder:before{content:"REPLINITY";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:800 clamp(44px,12vw,160px)/1 Orbitron,sans-serif;color:#ffffff08;pointer-events:none}
.founder>*{position:relative}
.founder .lbl{color:var(--mu);font:700 15px Orbitron,sans-serif;letter-spacing:.3em}
.founder h2{font-size:clamp(38px,9vw,72px);margin:14px 0 20px;line-height:1.1}
.founder em{font-style:normal;color:var(--g);text-shadow:0 0 22px var(--g)}
.founder .bar{width:140px;height:3px;margin:0 auto;background:var(--g);border-radius:3px;box-shadow:0 0 12px var(--g)}
.copy{padding:18px;color:var(--mu);text-align:center;border-top:1px solid var(--line);font-size:14px}

/* chat */
.chat{border:1px solid var(--g);border-radius:18px;background:var(--panel);box-shadow:0 0 40px #39ff1422;display:flex;flex-direction:column;height:420px;overflow:hidden}
.chat .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:9px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--g);color:#000;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:#171717;border-bottom-left-radius:4px}
.m.o{align-self:flex-start;background:#0f2a0f;border:1px solid var(--gd);border-bottom-left-radius:4px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat input{flex:1;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
#cw{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(460px,calc(100dvh - 190px));z-index:40}
#cw[hidden],.fab[hidden]{display:none}
.fab{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border:0;background:none;padding:0;display:grid;place-items:center;z-index:41;transition:transform .08s}
.fab svg{width:62px;height:62px;overflow:visible;filter:drop-shadow(0 1px 0 #2fd10f) drop-shadow(0 2px 0 #1f9e0a) drop-shadow(0 3px 0 #17820a) drop-shadow(0 4px 0 #116a07) drop-shadow(0 5px 0 #0c5205) drop-shadow(0 12px 8px #000000cc) drop-shadow(0 0 12px #39ff1466)}
.fab:active{transform:translateY(4px)}.fab:active svg{filter:drop-shadow(0 1px 0 #17820a) drop-shadow(0 6px 4px #000000cc)}

/* feedback dialog */
dialog{width:min(440px,calc(100vw - 32px));background:var(--panel);color:var(--tx);border:1px solid var(--g);border-radius:18px;padding:22px;box-shadow:0 0 40px #39ff1433}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{font-size:19px;margin-bottom:4px}

/* app */
.app{display:grid;min-height:calc(100dvh - var(--hh))}
@media(min-width:820px){.app{grid-template-columns:230px 1fr}}
.side{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
@media(min-width:820px){.side{position:sticky;top:var(--hh);align-self:start;height:calc(100dvh - var(--hh));overflow:auto}}
@media(max-width:819px){.side{display:none;position:fixed;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;left:0;width:min(280px,78vw);z-index:20;background:#000;border-right:2px solid var(--g)}.side.open{display:flex}}
.side button{text-align:left;background:none;border:0;padding:11px 12px;border-radius:10px;color:var(--tx)}
.side button.on{background:linear-gradient(180deg,#2c3f27,#15210f 55%,#0a1108);color:var(--g);font-weight:700;box-shadow:inset 0 0 0 2px #39ff14,inset 0 3px 0 #ffffff2e,0 3px 0 #17820a,0 5px 10px #000000b3}
.side .adm{margin-top:auto;border:1px solid var(--gd);border-radius:12px;padding:12px;color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.main{padding:22px 18px;min-width:0;width:100%;max-width:1100px}
.main h2{font-size:24px;margin-bottom:4px}.sub{color:var(--mu);margin:0 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(min-width:820px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{border:1px solid var(--gd);border-radius:14px;padding:14px;background:var(--panel)}
.st small{color:var(--mu)}.st div{font:800 28px Orbitron,sans-serif;margin-top:4px}
.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:14px}
.empty{color:var(--mu);text-align:center;padding:26px 0}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li small{color:var(--mu);display:block}
.li button.rm{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--err)}
.grid2{display:grid;gap:14px}
@media(min-width:980px){.grid2{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--mu);font-weight:500}
.tw{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.tile{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:inset 0 1px 0 #ffffff33,0 6px 0 #0f4a09,0 14px 22px #000000d9,0 0 90px #39ff1466}}}

/* 3D depth for everything else */
:root{--face:linear-gradient(180deg,#1f261f 0%,#111511 100%);--rim:#34423a;--ledge:#123510}
.plan,.st,.box,.pol,.chat,dialog{background:var(--face);border:1px solid var(--rim);box-shadow:inset 0 1px 0 #ffffff2e,inset 0 -2px 0 #00000066,0 6px 0 var(--ledge),0 14px 22px #000000d9}
.plan.hot{border-color:var(--g);box-shadow:inset 0 1px 0 #ffffff40,inset 0 -2px 0 #00000066,0 6px 0 #17820a,0 14px 22px #000000d9,0 0 30px #39ff1433}
.st{border-color:#2c6a20}
.tile{box-shadow:inset 0 1px 0 #ffffff33,0 6px 0 #0f4a09,0 14px 22px #000000d9,0 0 50px #39ff1440}
.lg{box-shadow:inset 0 1px 0 #ffffff33,0 3px 0 #0f4a09,0 6px 8px #000000d9}
.fld,.chat input{background:#060806;border:1px solid #2f3d2f;box-shadow:inset 0 3px 7px #000000e6,0 1px 0 #ffffff24}
.fld:focus,.chat input:focus{border-color:var(--g);outline:none;box-shadow:inset 0 3px 7px #000000e6,0 0 0 3px #39ff1455}
.seg{background:#060806;border-color:#2f3d2f;box-shadow:inset 0 3px 7px #000000e6,0 1px 0 #ffffff24}
.steps .s{background:linear-gradient(180deg,#232b23,#0b0e0b);box-shadow:inset 0 1px 0 #ffffff2e,0 3px 0 #000,0 7px 9px #000000d9}
.steps .s.on{border-color:var(--gd);box-shadow:inset 0 1px 0 #ffffff2e,0 3px 0 #0f4a09,0 7px 9px #000000d9,0 0 16px #39ff1455}
.steps .s.done{background:linear-gradient(180deg,#a6ff8c,#39ff14 45%,#22d106);box-shadow:inset 0 2px 0 #ffffffc0,0 3px 0 #17820a,0 7px 9px #000000d9}
.m.u{background:linear-gradient(180deg,#a6ff8c,#39ff14 45%,#22d106);box-shadow:inset 0 1px 0 #ffffffb0,0 3px 0 #17820a,0 6px 8px #000000b3}
.m.b,.m.o{box-shadow:inset 0 1px 0 #ffffff26,0 3px 0 #060806,0 6px 8px #000000b3}
.m.b{background:linear-gradient(180deg,#262e26,#161a16)}
.plan .tg{background:linear-gradient(180deg,#a6ff8c,#39ff14 50%,#22d106);box-shadow:inset 0 1px 0 #ffffffb0,0 2px 0 #17820a,0 4px 6px #000000b3}
.founder .bar{box-shadow:0 2px 0 #17820a,0 5px 6px #000000b3,0 0 12px var(--g)}
.plan .pr,.founder em,.founder h2,.flow h1,.sec h2,.brand,.brand b{text-shadow:none}
.demo{background:#1a1405;border-bottom:1px solid #6b4d0a;color:#ffd780;text-align:center;font-size:14px;line-height:1.4;padding:8px 16px}
.demo a{color:#ffd780;font-weight:700}
.bd{background:#ffb020;color:#1a1100;border-radius:999px;font:700 11px/1 "DM Sans",sans-serif;padding:4px 8px}
.note{text-align:left;background:#1a1405;border:1px solid #6b4d0a;color:#ffd780;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin:0 0 20px}
.note b{color:#ffb020}
.pw{margin-top:6px}.pw a{color:var(--g)}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<div class="demo" id="dm"><b>Demo prototype.</b> Replinity isn’t registered yet, so this is for testing only. Questions? Call or WhatsApp 3RROR STUDIO on <a href="tel:0626396812">062 639 6812</a></div>
<main id="v"></main>
<footer id="ft"></footer>

<button class="fab" id="fab" aria-label="Chat with the Replinity assistant" hidden>
 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" fill="#39ff14" stroke="#b9ffa6" stroke-width="1" stroke-linejoin="round"/><circle cx="8.5" cy="12" r="1.25" fill="#04140a"/><circle cx="12" cy="12" r="1.25" fill="#04140a"/><circle cx="15.5" cy="12" r="1.25" fill="#04140a"/></svg>
</button>

 </form>
</dialog>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Put your email here to have feedback open in the visitor's email app, e.g. 'hello@replinity.co.za' */
const FEEDBACK_TO='';
const FEEDBACK_WA='27626396812'; /* feedback opens a WhatsApp message to 3RROR STUDIO */
const mem={};
const get=(k,d)=>{try{const v=localStorage.getItem('rp_'+k);return v?JSON.parse(v):d}catch(e){return mem[k]??d}};
const set=(k,v)=>{try{localStorage.setItem('rp_'+k,JSON.stringify(v))}catch(e){mem[k]=v}};
const brand='<span class="brand">REPLI<b>NITY</b></span>';
const TAGLINE='AI That Replies, So You Don’t Have To.';

const plans=[
 {n:'Starter',tag:'Basic',setup:990,mo:499,li:['1 WhatsApp number','500 chats a month']},
 {n:'Growth',tag:'Popular',hot:1,setup:1990,mo:999,li:['2 numbers','2,000 chats a month','Automations']},
 {n:'Pro',setup:3990,mo:1999,li:['Unlimited chats','Custom training','Priority support']}];

const homeKB=[
 {k:'price,cost,how much,pricing,plan,rand',a:'Starter is R990 setup + R499/month, Growth is R1990 setup + R999/month and Pro is R3990 setup + R1999/month. No contracts, cancel anytime.'},
 {k:'whatsapp,connect,link number',a:'Yes! Replinity connects to your business WhatsApp so customers get instant answers 24/7.'},
 {k:'setup,start,how long,install,onboard',a:'Setup takes under a day. You add your business info, we train your assistant, and you go live.'},
 {k:'language,zulu,afrikaans,xhosa,sotho,english',a:'Your assistant can reply in English, Zulu, Afrikaans and more, matching your customer.'},
 {k:'human,person,owner,speak to',a:'Anything the AI is unsure about is flagged in your inbox so you can step in.'},
 {k:'demo,real,prototype,register,registered,test',a:'This is a Replinity demo prototype. Replinity isn\'t registered yet, so nothing here is a real account. Call or WhatsApp 3RROR STUDIO on 062 639 6812.'},
 {k:'hello,hi,hey,howzit,sawubona',a:'Howzit! I\'m the Replinity assistant. Ask me about pricing, WhatsApp or setup.'}];
const defKB=[
 {k:'hours,open,close,time',a:'We\'re open Monday to Saturday, 8am to 6pm.'},
 {k:'price,cost,how much,quote',a:'Prices depend on what you need. Tell us what you\'re looking for and we\'ll send a quote.'},
 {k:'where,location,address,directions',a:'Add your address in AI Knowledge and your customers will get it instantly.'},
 {k:'book,booking,appointment,reserve',a:'Sure, send your preferred date and time and we\'ll confirm.'},
 {k:'hello,hi,hey,howzit,sawubona',a:'Howzit! How can we help you today?'}];

function reply(kb,q){
 q=q.toLowerCase();let best=null,bs=0;
 for(const e of kb){let s=0;e.k.split(',').forEach(w=>{w=w.trim().toLowerCase();if(w&&q.includes(w))s+=w.length});if(s>bs){bs=s;best=e}}
 return best?{x:best.a,fb:false}:{x:'Thanks for your message. I\'ve passed this to the team and they\'ll get back to you soon.',fb:true};
}

/* chat widget */
function chat(root,kb,o){
 o=o||{};let id=null;
 root.innerHTML='<div class="hd"><span class="dot"></span>'+esc(o.title||'Assistant')+'</div><div class="msgs" aria-live="polite"></div><form><input aria-label="Message" placeholder="Type a message…" autocomplete="off"><button class="btn sm">Send</button></form>';
 const box=root.querySelector('.msgs'),inp=root.querySelector('input');
 const add=(f,x)=>{const d=document.createElement('div');d.className='m '+f;d.textContent=x;box.append(d);box.scrollTop=box.scrollHeight};
 add('b',o.greet||'Howzit! Ask me anything.');
 root.querySelector('form').onsubmit=e=>{
  e.preventDefault();const q=inp.value.trim();if(!q)return;inp.value='';add('u',q);
  if(o.save){const c=get('chats',[]);let ch=c.find(z=>z.id===id);if(!ch){id=Date.now();ch={id,name:'Test chat '+(c.length+1),msgs:[]};c.unshift(ch)}ch.msgs.push({f:'u',x:q,t:Date.now()});set('chats',c)}
  setTimeout(()=>{const r=reply(kb(),q);add('b',r.x);
   if(o.save){const c=get('chats',[]);const ch=c.find(z=>z.id===id);if(ch){ch.msgs.push({f:'b',x:r.x,t:Date.now(),fb:r.fb});set('chats',c)}}},450);
 };
}

function account(){
 const su=mode==='signup';
 $('#v').innerHTML=`<div class="flow">${tile}<p class="tagline">${TAGLINE}</p>${steps(2)}<div class="stepcard">${note('<b>Demo account.</b> For testing only. Use any email and a made-up password, not your real one. Your details stay on this device.')}<h1>Do you already have a demo account?</h1>
 <div class="seg"><button type="button" data-mode="login" class="${su?'':'on'}">I have a demo account</button><button type="button" data-mode="signup" class="${su?'on':''}">I’m new here</button></div>
 <p class="lead" style="margin:14px auto 4px;font-size:15px">${su?(picked?`Create a demo account to try the ${esc(picked)} plan.`:'Create a demo account with any email and password.'):'Log in to your demo account.'}</p>
 <form class="frm" id="af" novalidate><label for="em">Email</label><input class="fld" id="em" type="email" required autocomplete="email">
 <label for="pw">Password</label><input class="fld" id="pw" type="password" minlength="6" required autocomplete="${su?'new-password':'current-password'}">
 <div class="err" id="er" role="alert"></div><button class="btn lg">${su?'Create demo account':'Log in to demo'}</button></form>
 <div class="back"><button type="button" class="lnk" data-go="home">← Back</button></div></div></div>`;
 $('#af').onsubmit=async e=>{
  e.preventDefault();
  const er=t=>{$('#er').textContent=t};
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!/^\S+@\S+\.\S+$/.test(em))return er('Enter a valid email, like name@example.com.');
  if(pw.length<6)return er('Your password needs at least 6 characters.');
  er('');
  try{
  const us=get('users',[]);
  const h=await hash(pw);
  if(su){
   if(us.find(x=>x.em===em))return $('#er').textContent='That email already has a demo account on this device. Tap “I have a demo account” to log in.';
   const u={em,h,biz:'',plan:picked||''};us.push(u);set('users',us);sess(u);go('business');
  }else{
   const u=us.find(x=>x.em===em&&x.h===h);
   if(!u)return $('#er').textContent='Wrong email or password. Check and try again, or tap “I’m new here”.';
   sess(u);go(u.biz?'app':'business');
  }
  }catch(err){er('Something went wrong: '+err.message+'. Try again.')}
 };
}
function business(){
 $('#v').innerHTML=`<div class="flow">${tile}<p class="tagline">${TAGLINE}</p>${steps(3)}<div class="stepcard">${note('<b>Demo business.</b> Use your real business or make one up. The demo assistant will use it.')}<h1>Tell us about your business</h1><p class="lead" style="font-size:15px;margin-bottom:4px">This is how your assistant will introduce itself.</p>
 <form class="frm" id="bf" novalidate><label for="bn">Business name</label><input class="fld" id="bn" required autocomplete="organization">
 <label for="bw">Business WhatsApp number (optional)</label><input class="fld" id="bw" type="tel" placeholder="+27 …" autocomplete="tel">
 <div class="err" id="er" role="alert"></div><button class="btn lg">Finish and open demo dashboard</button></form>
 <div class="back"><button type="button" class="lnk" id="sk">Skip for now</button></div></div></div>`;
 const fin=(biz,wa)=>{
  const s=get('session',null);if(!s)return go('account');
  const us=get('users',[]),u=us.find(x=>x.em===s.em);if(u){u.biz=biz;set('users',us)}
  set('session',{...s,biz});
  if(wa){const c=get('cfg',{bot:'Replinity Assistant',greet:'Howzit! How can we help you today?'});c.wa=wa;set('cfg',c)}
  go('app');
 };
 $('#bf').onsubmit=e=>{e.preventDefault();const b=$('#bn').value.trim();if(!b)return $('#er').textContent='Enter your business name, or tap “Skip for now”.';
  try{fin(b,$('#bw').value.trim())}catch(err){$('#er').textContent='Something went wrong: '+err.message}};
 $('#sk').onclick=()=>fin('My business','');
}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
function sess(u){set('session',{em:u.em,biz:u.biz||'',plan:u.plan||''})}

const tabs=[['dash','Dashboard'],['inbox','Inbox'],['cust','Customers'],['kb','AI Knowledge'],['test','Chat Tester'],['plans','Plans'],['set','Settings']];
let mode='login',picked=null,view='home',tab='dash',openChat=null;
function seed(){
 if(get('seeded',0))return;
 const n=Date.now(),m=(f,x,min,fb)=>({f,x,t:n-min*60000,fb});
 const c=get('chats',[]);
 set('chats',[
  {id:n-3,name:'Thandi (sample)',msgs:[m('u','Hi, what time do you open?',95),m('b','We\'re open Monday to Saturday, 8am to 6pm.',95,false),m('u','Can I book for Saturday 10am?',92),m('b','Sure, send your preferred date and time and we\'ll confirm.',92,false)]},
  {id:n-2,name:'Sipho (sample)',msgs:[m('u','Do you deliver to Soweto?',40),m('b','Thanks for your message. I\'ve passed this to the team and they\'ll get back to you soon.',40,true),m('o','Hi Sipho, yes we deliver to Soweto. Send your address and we\'ll quote you.',33)]},
  {id:n-1,name:'Lerato (sample)',msgs:[m('u','how much for a quote',12),m('b','Prices depend on what you need. Tell us what you\'re looking for and we\'ll send a quote.',12,false)]},
  ...c]);
 set('seeded',1);
}
function app(){
 seed();
 const u=get('session',null);
 $('#v').innerHTML=`<div class="app"><aside class="side" id="sd">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}<button data-act="fb">Send feedback</button><button data-act="out">Log out</button><div class="adm"><b>${esc(u.biz||'Your business')}</b><br>${esc(u.em)}</div></aside><section class="main"><div id="pane"></div></section></div>`;
 pane();
}
function pane(){
 const p=$('#pane'),chats=get('chats',[]),kb=get('kb',defKB),cf=get('cfg',{bot:'Replinity Assistant',greet:'Howzit! How can we help you today?'}),u=get('session');
 const day=new Date().toDateString();
 if(tab==='dash'){
  const all=chats.flatMap(c=>c.msgs),today=all.filter(m=>new Date(m.t).toDateString()===day).length,bot=all.filter(m=>m.f==='b'),ok=bot.filter(m=>!m.fb).length;
  const act=all.slice().sort((a,b)=>b.t-a.t).slice(0,5);
  p.innerHTML=`<h2>Dashboard</h2><p class="sub">Welcome, ${esc(u.biz||'there')}. Here's your snapshot.</p>${note('<b>Demo mode.</b> Sample conversations are loaded so you can explore the inbox, customers and AI replies. Real WhatsApp connects after launch.')}<div class="stats"><div class="st"><small>Total customers</small><div>${chats.length}</div></div><div class="st"><small>Messages today</small><div>${today}</div></div><div class="st"><small>AI answered</small><div>${ok}</div></div><div class="st"><small>Needs you</small><div>${bot.length-ok}</div></div></div>
  <div class="box"><h3 style="margin-bottom:8px">Recent activity</h3>${act.length?act.map(m=>`<div class="li"><div>${esc(m.x.slice(0,80))}<small>${m.f==='u'?'Customer':m.f==='o'?'You':'AI'} · ${new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join(''):'<div class="empty">No activity yet. Try the Chat Tester.</div>'}</div><div class="box"><h3>Finished exploring?</h3><p class="sub" style="margin:6px 0 14px">Tell us what worked and what didn’t. It goes straight to the team.</p><button class="btn" data-act="fb">Leave feedback</button></div>`;
 }
 if(tab==='inbox'){
  const c=chats.find(x=>x.id===openChat);
  p.innerHTML=`<h2>Inbox</h2><p class="sub">Every conversation your assistant has.</p><div class="grid2"><div class="box">${chats.length?chats.map(x=>`<div class="li"><div><b>${esc(x.name)}</b><small>${esc(x.msgs.at(-1).x.slice(0,50))}</small></div><button class="btn ghost sm" data-open="${x.id}">Open</button></div>`).join(''):'<div class="empty">No conversations yet.</div>'}</div>
  <div class="box">${c?`<h3>${esc(c.name)}</h3><div class="msgs" style="max-height:300px">${c.msgs.map(m=>`<div class="m ${m.f}">${esc(m.x)}</div>`).join('')}</div><form id="rf" style="display:flex;gap:10px;margin-top:10px"><input class="fld" id="ri" placeholder="Reply as owner…" style="flex:1"><button class="btn sm">Send</button></form>`:'<div class="empty">Pick a conversation.</div>'}</div></div>`;
  const rf=$('#rf');if(rf)rf.onsubmit=e=>{e.preventDefault();const v=$('#ri').value.trim();if(!v)return;c.msgs.push({f:'o',x:v,t:Date.now()});set('chats',chats);pane()};
 }
 if(tab==='cust'){
  p.innerHTML=`<h2>Customers</h2><p class="sub">People who have messaged your assistant.</p><div class="box tw">${chats.length?`<table><tr><th>Name</th><th>Messages</th><th>Last seen</th></tr>${chats.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.msgs.length}</td><td>${new Date(x.msgs.at(-1).t).toLocaleDateString()}</td></tr>`).join('')}</table>`:'<div class="empty">No customers yet.</div>'}</div>`;
 }
 if(tab==='kb'){
  p.innerHTML=`<h2>AI Knowledge</h2><p class="sub">Teach your assistant. It replies when a customer's message contains one of the keywords.</p><div class="grid2"><div class="box"><h3 style="margin-bottom:6px">Add an answer</h3><form id="kf"><label for="kk">Keywords (comma separated)</label><input class="fld" id="kk" placeholder="delivery, shipping" required><label for="ka">Answer</label><textarea class="fld" id="ka" rows="3" required></textarea><button class="btn" style="margin-top:12px">Save answer</button></form></div>
  <div class="box"><h3 style="margin-bottom:6px">Saved answers (${kb.length})</h3>${kb.map((e,i)=>`<div class="li"><div><b>${esc(e.k)}</b><small>${esc(e.a)}</small></div><button class="rm" data-del="${i}" aria-label="Delete">Delete</button></div>`).join('')||'<div class="empty">Nothing saved yet.</div>'}</div></div>`;
  $('#kf').onsubmit=e=>{e.preventDefault();kb.push({k:$('#kk').value.trim(),a:$('#ka').value.trim()});set('kb',kb);pane()};
 }
 if(tab==='test'){
  p.innerHTML=`<h2>Chat Tester</h2><p class="sub">Talk to your assistant like a customer. Chats appear in your Inbox.</p><div class="chat" id="tc" style="max-width:520px"></div>`;
  chat($('#tc'),()=>get('kb',defKB),{save:true,title:cf.bot,greet:cf.greet});
 }
 if(tab==='plans'){
  p.innerHTML=`<h2>Plans</h2><p class="sub">Pay the setup fee once, then the monthly price.</p>${planCards(false)}`;
 }
 if(tab==='set'){
  p.innerHTML=`<h2>Settings</h2><p class="sub">Name and greet your assistant.</p><form class="box" id="sf" style="max-width:520px"><label for="s1">Assistant name</label><input class="fld" id="s1" value="${esc(cf.bot)}"><label for="s2">Greeting</label><input class="fld" id="s2" value="${esc(cf.greet)}"><label for="s3">Business WhatsApp number</label><input class="fld" id="s3" placeholder="+27 ..." value="${esc(cf.wa||'')}"><p class="sub" style="margin-top:10px;font-size:14px">Number is saved for later. Live WhatsApp needs the Replinity server.</p><button class="btn">Save settings</button></form>`;
  $('#sf').onsubmit=e=>{e.preventDefault();set('cfg',{bot:$('#s1').value,greet:$('#s2').value,wa:$('#s3').value});alert('Saved')};
 }
}

/* router */
function go(v,h){
 const u=get('session',null);
 if(v==='app'&&!u)v='account';
 if(v==='app'&&u&&!u.biz)v='business';
 if((v==='home'||v==='account')&&u)v=u.biz?'app':'business';
 if(v==='business'&&!u)v='account';
 view=v;hdr(v);ft();
 $('#fab').hidden=v!=='home';if(v!=='home')$('#cw').hidden=true;
 ({home,account,business,app})[v]();
 if(h)requestAnimationFrame(()=>document.getElementById(h)?.scrollIntoView());else scrollTo(0,0);
}
function jump(h){const el=document.getElementById(h);if(el)el.scrollIntoView();else go('home',h)}

/* floating chat */
let cwReady=false;
$('#fab').onclick=()=>{
 const w=$('#cw');w.hidden=!w.hidden;
 if(!w.hidden&&!cwReady){chat(w,()=>homeKB,{title:'Replinity Assistant',greet:'Howzit! Ask me about pricing, WhatsApp or setup.'});cwReady=true}
 if(!w.hidden)w.querySelector('input')?.focus();
};

/* feedback */
const fd=$('#fbd');
function openFb(){$('#fbm').value='';$('#fbs').textContent='';fd.showModal()}
$('#fbx').onclick=()=>fd.close();
$('#fbf').onsubmit=e=>{
 e.preventDefault();const m=$('#fbm').value.trim();if(!m){$('#fbs').style.color='';return $('#fbs').textContent='Write a short message first.'}
 const l=get('feedback',[]);l.push({m,t:Date.now(),em:(get('session',null)||{}).em||''});set('feedback',l);
 if(FEEDBACK_TO)location.href='mailto:'+FEEDBACK_TO+'?subject='+encodeURIComponent('Replinity feedback')+'&body='+encodeURIComponent(m);
 window.open('https://wa.me/'+FEEDBACK_WA+'?text='+encodeURIComponent('Replinity demo feedback:\n'+m),'_blank','noopener');
 $('#fbs').style.color='var(--g)';$('#fbs').textContent='Thanks! WhatsApp will open so you can send it to us.';
 setTimeout(()=>{fd.close();$('#fbs').style.color=''},1800);
};

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-tab],[data-act],[data-open],[data-del],[data-mode],[data-plan],[data-jump]');
 if(!t){return}
 const d=t.dataset;
 if(d.act!=='nav')$('#nv')?.classList.remove('open');
 if(d.act==='nav'){$('#nv').classList.toggle('open');return}
 if(d.act==='menu'){$('#sd')?.classList.toggle('open');return}
 if(d.act==='fb'){$('#sd')?.classList.remove('open');openFb();return}
 if(d.act==='out'){set('session',null);mode='login';tab='dash';go('home');return}
 if(d.act==='brand'){go(get('session',null)?'app':'home');return}
 if(d.jump){jump(d.jump);return}
 if(d.mode)mode=d.mode;
 if(d.plan)picked=d.plan;
 if(d.go){go(d.go);return}
 if(d.mode){account();return}
 if(d.tab){tab=d.tab;app();return}
 if(d.open){openChat=+d.open;pane();return}
 if(d.del!==undefined){const k=get('kb',defKB);k.splice(+d.del,1);set('kb',k);pane()}
});
go(get('session',null)?'app':'home');
</script>
</body>
</html>
